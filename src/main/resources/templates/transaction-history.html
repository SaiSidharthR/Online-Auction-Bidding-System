<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Transactions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Auction System</a>
        <div class="ms-auto d-flex gap-2">
            <a th:href="@{/customer/dashboard}" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <h3 class="mb-3">My Transactions</h3>
    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success != null}" class="alert alert-success" th:text="${success}"></div>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>Reference</th>
            <th>Item</th>
            <th>Amount</th>
            <th>Charge</th>
            <th>Total Debit</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tx : ${transactions}">
            <td><a th:href="@{'/customer/transactions/' + ${tx.id}}" th:text="${tx.reference}"></a></td>
            <td th:text="${tx.auctionItemRef}"></td>
            <td th:text="'Rs.' + ${#numbers.formatDecimal(tx.amount, 0, 'COMMA', 2, 'POINT')}"></td>
            <td th:text="'Rs.' + ${#numbers.formatDecimal(tx.charge, 0, 'COMMA', 2, 'POINT')}"></td>
            <td th:text="'Rs.' + ${#numbers.formatDecimal(tx.totalDebit, 0, 'COMMA', 2, 'POINT')}"></td>
            <td th:text="${tx.status}"></td>
            <td>
                <form th:if="${tx.status.name() == 'SUCCESS'}" th:action="@{'/customer/transactions/' + ${tx.id} + '/reverse'}" method="post">
                    <button type="submit" class="btn btn-sm btn-warning">Reverse</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
