<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Audit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Auction System</a>
        <div class="ms-auto d-flex gap-2">
            <a th:href="@{/admin/transactions}" class="btn btn-outline-light btn-sm">Transactions</a>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <h3 class="mb-3">Audit History</h3>
    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>Reference</th>
            <th>Old Status</th>
            <th>New Status</th>
            <th>Actor</th>
            <th>Time</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${auditHistory}">
            <td th:text="${h.referenceId}"></td>
            <td th:text="${h.oldStatus}"></td>
            <td th:text="${h.newStatus}"></td>
            <td th:text="${h.actorId}"></td>
            <td th:text="${#temporals.format(h.eventAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
