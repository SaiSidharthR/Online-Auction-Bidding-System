<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Auction System</a>
        <div class="ms-auto">
            <span class="navbar-text text-white me-3" th:text="'Welcome, ' + ${user.name}"></span>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success != null}" class="alert alert-success" th:text="${success}"></div>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Bid</h5>
                    <p class="card-text">Create a new auction bid request.</p>
                    <a th:href="@{/customer/bid}" class="btn btn-primary">Enter Bid Details</a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">History</h5>
                    <p class="card-text">View your own transaction history.</p>
                    <a th:href="@{/customer/transactions}" class="btn btn-outline-primary">My Transactions</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
