<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transaction Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Auction System</a>
        <div class="ms-auto d-flex gap-2">
            <a th:href="@{/customer/dashboard}" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="mb-3">Transaction Detail</h3>
            <table class="table table-bordered">
                <tr><th>Reference</th><td th:text="${transaction.reference}"></td></tr>
                <tr><th>Owner</th><td th:text="${transaction.ownerUser.name}"></td></tr>
                <tr><th>Account</th><td th:text="${transaction.accountId}"></td></tr>
                <tr><th>Item</th><td th:text="${transaction.auctionItemRef}"></td></tr>
                <tr><th>Amount</th><td th:text="'Rs.' + ${#numbers.formatDecimal(transaction.amount, 0, 'COMMA', 2, 'POINT')}"></td></tr>
                <tr><th>Charge</th><td th:text="'Rs.' + ${#numbers.formatDecimal(transaction.charge, 0, 'COMMA', 2, 'POINT')}"></td></tr>
                <tr><th>Total Debit</th><td th:text="'Rs.' + ${#numbers.formatDecimal(transaction.totalDebit, 0, 'COMMA', 2, 'POINT')}"></td></tr>
                <tr><th>Status</th><td th:text="${transaction.status}"></td></tr>
            </table>

            <h4 class="mt-4">Audit History</h4>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Old</th>
                    <th>New</th>
                    <th>Actor</th>
                    <th>Time</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="h : ${history}">
                    <td th:text="${h.oldStatus}"></td>
                    <td th:text="${h.newStatus}"></td>
                    <td th:text="${h.actorId}"></td>
                    <td th:text="${#temporals.format(h.eventAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
