<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bid Review</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Auction System</a>
        <div class="ms-auto d-flex gap-2">
            <a th:href="@{/customer/dashboard}" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="mb-4">Review Bid</h3>
                    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
                    <div th:if="${success != null}" class="alert alert-success" th:text="${success}"></div>

                    <table class="table table-bordered">
                        <tr><th>Customer ID</th><td th:text="${bid.customerId}"></td></tr>
                        <tr><th>Auction Item</th><td th:text="${bid.auctionItemRef}"></td></tr>
                        <tr><th>Bid Amount</th><td th:text="'Rs.' + ${#numbers.formatDecimal(bid.amount, 0, 'COMMA', 2, 'POINT')}"></td></tr>
                        <tr><th>Service Charge</th><td th:text="'Rs.' + ${#numbers.formatDecimal(bid.charge, 0, 'COMMA', 2, 'POINT')}"></td></tr>
                        <tr><th>Total Debit</th><td th:text="'Rs.' + ${#numbers.formatDecimal(bid.totalDebit, 0, 'COMMA', 2, 'POINT')}"></td></tr>
                    </table>

                    <form th:action="@{/customer/bid/authorise}" method="post" class="mt-4">
                        <div class="mb-3">
                            <label class="form-label">Re-enter PIN to Authorise</label>
                            <input type="password" name="pin" class="form-control" maxlength="4" pattern="\d{4}" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Authorise</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
