<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Transactions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Auction System</a>
        <div class="ms-auto d-flex gap-2">
            <a th:href="@{/admin/audit}" class="btn btn-outline-light btn-sm">Audit</a>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <h3 class="mb-3">All Transactions</h3>
    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success != null}" class="alert alert-success" th:text="${success}"></div>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>Reference</th>
            <th>Customer</th>
            <th>Item</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tx : ${transactions}">
            <td><a th:href="@{'/admin/transactions/' + ${tx.id}}" th:text="${tx.reference}"></a></td>
            <td th:text="${tx.ownerUser.name}"></td>
            <td th:text="${tx.auctionItemRef}"></td>
            <td th:text="'Rs.' + ${#numbers.formatDecimal(tx.amount, 0, 'COMMA', 2, 'POINT')}"></td>
            <td th:text="${tx.status}"></td>
            <td>
                <form th:if="${tx.status.name() == 'INITIATED'}" th:action="@{'/admin/transactions/' + ${tx.id} + '/authorise'}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-primary">Authorise</button>
                </form>
                <form th:if="${tx.status.name() == 'AUTHORISED'}" th:action="@{'/admin/transactions/' + ${tx.id} + '/success'}" method="post" class="d-inline">
                    <input type="password" name="pin" maxlength="4" pattern="\d{4}" class="form-control form-control-sm d-inline-block" style="width: 90px;" placeholder="PIN" required>
                    <button type="submit" class="btn btn-sm btn-success">Success</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
